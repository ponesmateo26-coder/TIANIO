project:
  source_files:
    - project.v
  top_module:  "tt_um_example"
  
  title:       "Hardware Electronic Dice"
  author:      "Open Source Hardware Contributor"
  discord:     ""
  description: "High-speed 1-to-6 counter driving a 7-segment display for random dice rolls."
  language:    "Verilog"
  clock_hz:    50000000  # 50 MHz standard system clock

  tiles: "1x1"

pinout:
  # Inputs
  ui[0]: "ROLL_BTN (Hold to roll, release to stop)"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "Segment A"
  uo[1]: "Segment B"
  uo[2]: "Segment C"
  uo[3]: "Segment D"
  uo[4]: "Segment E"
  uo[5]: "Segment F"
  uo[6]: "Segment G"
  uo[7]: "Decimal Point"
